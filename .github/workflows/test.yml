name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The scene build (scene/build.sh, emsdk) is committed, so CI only serves
      # the fixture and checks the page, its assets and the feed.
      - run: python3 -m unittest discover -s tests -v
